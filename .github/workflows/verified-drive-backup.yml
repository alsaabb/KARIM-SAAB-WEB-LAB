name: Verified Google Drive backup retention (no deploy)

on:
  workflow_run:
    workflows:
      - Archive KARIM SAAB source and published site (no deploy)
    types:
      - completed
  workflow_dispatch:
    inputs:
      archive_run_id:
        description: Successful archive workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: karim-saab-drive-backup-single-copy
  cancel-in-progress: false

jobs:
  verify-upload-retain:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout backup code only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Validate script syntax
        run: python -m py_compile scripts/verified_drive_backup.py

      - name: Verify archive and upload before removing obsolete copies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          ARCHIVE_RUN_ID: ${{ github.event.workflow_run.id || inputs.archive_run_id }}
        run: |
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::GDRIVE_SERVICE_ACCOUNT_KEY is missing"
            exit 1
          fi
          python scripts/verified_drive_backup.py

      # No site changes, no deployment, no writes to GitHub main.
