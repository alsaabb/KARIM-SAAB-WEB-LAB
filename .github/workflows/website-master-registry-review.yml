name: KARIM SAAB Master — audit and registry review (no publish)
# Auto-regenerates registries on *review branches*, never on main.
# This does NOT access Google Drive or authorize automatic publishing.
on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
    paths:
      - 'dist/**'
      - 'scripts/build_site_master_registry.py'
      - 'docs/KARIM_SAAB_WEBSITE_MASTER.md'
      - 'docs/KARIM_SAAB_WEBSITE_CHANGELOG.md'
      - '.github/workflows/website-master-registry-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.repository == 'alsaabb/KARIM-SAAB-WEB-LAB' && github.ref != 'refs/heads/main' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/chore/'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout review branch (NOT main)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate complete page and media registries
        run: |
          python3 scripts/build_site_master_registry.py --write
          python3 scripts/build_site_master_registry.py --check
      - name: Run master inventory unit tests
        run: python3 -m unittest discover -s tests -p 'test_site_master_registry.py' -v
      - name: Preserve existing website links and release checks
        run: python3 scripts/verify_site.py
      - name: Commit generated registry only to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/registry/page_registry.json docs/registry/media_registry.json docs/registry/INVENTORY_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(master): snapshot all bilingual routes and media from site sources"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
      - name: Upload review-only inventory snapshots (NOT deployed)
        uses: actions/upload-artifact@v4
        with:
          name: KARIM_SAAB_SITE_MASTER_REGISTRY_REVIEW_${{ github.run_id }}
          path: |
            docs/KARIM_SAAB_WEBSITE_MASTER.md
            docs/KARIM_SAAB_WEBSITE_CHANGELOG.md
            docs/registry/
          if-no-files-found: error
          retention-days: 30
