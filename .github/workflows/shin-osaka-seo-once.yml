name: One-time complete generated SEO audit for Shin-Osaka V01
on:
  push:
    branches:
      - feature/unified-publishing-v3-review-20261117
    paths:
      - .github/workflows/shin-osaka-seo-once.yml

permissions:
  contents: write

jobs:
  reconcile-generated-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-publishing-v3-review-20261117
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild all generated metadata from authoritative sources
        run: |
          set -euo pipefail
          python3 scripts/build_seo_share.py --write
          python3 scripts/build_site_master_registry.py --write
          python3 scripts/publish_v3.py check --fast
          git diff --check
      - name: Commit generated files on existing PR only; retire one-shot helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist docs/seo docs/registry
          git rm -f .github/workflows/shin-osaka-seo-once.yml
          git diff --cached --check
          git commit -m "build(v3): synchronize derived Shin-Osaka SEO source audit"
          git push origin HEAD:refs/heads/feature/unified-publishing-v3-review-20261117
          echo "Generated source audit fixed. main not changed." >> "$GITHUB_STEP_SUMMARY"
