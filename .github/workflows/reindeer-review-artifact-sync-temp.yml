name: TEMP review artifact sync for Norway reindeer PR
on:
  push:
    branches:
      - review/reindeer-norway-i72sAiafvDw-awaiting-owner-posters
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/reindeer-norway-i72sAiafvDw-awaiting-owner-posters
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate approved SEO and registry artifacts only
        run: |
          python3 scripts/build_seo_share.py --write
          python3 scripts/build_site_master_registry.py --write
          python3 scripts/build_seo_share.py --check
          python3 scripts/build_site_master_registry.py --check
          python3 scripts/verify_site.py
          git diff --check
      - name: Commit generated files to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/share/ar/story-reindeer-close-call-norway.html dist/share/en/story-reindeer-close-call-norway.html dist/sitemap.xml docs/seo/SEO-GSC-001-SOURCE-AUDIT.md docs/registry/
          if ! git diff --cached --quiet; then
            git commit -m "build(reindeer): refresh generated SEO and site registries"
            git push origin HEAD:review/reindeer-norway-i72sAiafvDw-awaiting-owner-posters
          fi
