name: Sync approved content from Google Drive (review only)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# No direct write access to main, no automatic commit, push, or deployment.
permissions:
  contents: read

concurrency:
  group: karim-saab-drive-sync-review
  cancel-in-progress: false

jobs:
  sync-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main for isolated preview
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check required credentials without printing them
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          if [[ -z "$GDRIVE_SERVICE_ACCOUNT_KEY" ]]; then
            echo "::error::Missing GDRIVE_SERVICE_ACCOUNT_KEY repository secret"
            exit 1
          fi
          if [[ -z "$GDRIVE_FOLDER_ID" ]]; then
            echo "::error::Missing GDRIVE_FOLDER_ID repository secret"
            exit 1
          fi
          echo "Credentials supplied; values intentionally hidden"

      - name: Install Google Drive Python packages
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Read explicitly APPROVED Drive files into ephemeral checkout
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/sync_drive_to_github.py

      - name: Validate preview locally without publishing
        run: |
          python -m py_compile scripts/sync_drive_to_github.py
          python scripts/verify_site.py
          python scripts/verify_identity.py
          git diff --check

      - name: Build metadata-only review manifest
        shell: bash
        run: |
          mkdir -p sync-review
          git rev-parse HEAD > sync-review/source-main-sha.txt
          git status --short -- dist/ > sync-review/changed-paths.txt
          git diff --numstat -- dist/ > sync-review/change-size-summary.txt
          printf '%s\n' 'Preview only; no commit, push, or deployment performed.' > sync-review/READ_ME_FIRST.txt
          cat sync-review/READ_ME_FIRST.txt
          echo "Changed path count: $(wc -l < sync-review/changed-paths.txt)"
          if [[ ! -s sync-review/changed-paths.txt ]]; then
            echo "No approved changes found."
          fi

      - name: Archive review manifest only (no content or credentials)
        uses: actions/upload-artifact@v4
        with:
          name: karim-saab-drive-sync-review-manifest
          path: sync-review/
          retention-days: 7
          if-no-files-found: error

      # Explicit user approval is required before a separate PR may
      # change main or trigger publication. Do not add auto-publish steps.
