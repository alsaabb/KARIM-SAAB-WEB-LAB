name: Sync approved Google Drive content to review branches (no deploy)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Write access is limited by the commands below to append-only review branches.
# Never commit to main, merge a PR, or dispatch deployment.
permissions:
  contents: write

concurrency:
  group: karim-saab-drive-review-pipeline
  cancel-in-progress: false

env:
  GDRIVE_FOLDER_ID: '1Y97cN3z1sUzWmmK0nt0P3ZiEkYxd3aQP'

jobs:
  prepare-for-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production baseline without modifying it
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check private key exists without printing it
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        shell: bash
        run: |
          if [[ -z "$GDRIVE_SERVICE_ACCOUNT_KEY" ]]; then
            echo "::error::Missing GDRIVE_SERVICE_ACCOUNT_KEY"
            exit 1
          fi

      - name: Install Google Drive API libraries
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Read only explicitly approved Drive content
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/sync_drive_to_github.py

      - name: Validate site changes before staging
        run: |
          python -m py_compile scripts/sync_drive_to_github.py
          python scripts/verify_site.py
          python scripts/verify_identity.py
          git diff --check

      - name: Create a unique, non-destructive review branch if content changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- dist/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Drive scan succeeded. Nothing changed; production not touched."
            echo "No approved changes detected." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TREE="$(git write-tree)"
          REVIEW_BRANCH="drive/approved-review-${TREE:0:16}"
          if git ls-remote --exit-code --heads origin "refs/heads/$REVIEW_BRANCH" >/dev/null; then
            echo "Review branch already exists: $REVIEW_BRANCH; no duplicate created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$REVIEW_BRANCH"
          git commit -m "review: stage explicitly approved Google Drive content"
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          echo "Proposed files transferred into review branch: $REVIEW_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Production main, dist deployment, and existing review branches remain untouched." >> "$GITHUB_STEP_SUMMARY"
          git diff-tree --no-commit-id --name-only -r HEAD -- dist/ >> "$GITHUB_STEP_SUMMARY"
          echo "A human approval and separate merge are required to publish." >> "$GITHUB_STEP_SUMMARY"

      # Deliberately no direct push to main, PR merge, or site deployment.
