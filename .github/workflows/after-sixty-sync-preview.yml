name: After Sixty — preview approved Drive episodes

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: after-sixty-drive-review
  cancel-in-progress: false

jobs:
  preview-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out published main without modifying it
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create unique non-published review branch
        run: |
          BRANCH="sync/after-sixty-drive-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Require Drive credentials and confirmed folder
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          AFTER_SIXTY_DRIVE_FOLDER_ID: ${{ secrets.AFTER_SIXTY_DRIVE_FOLDER_ID }}
        run: |
          test -n "$GDRIVE_SERVICE_ACCOUNT_KEY" || { echo "::error::GDRIVE_SERVICE_ACCOUNT_KEY is missing"; exit 1; }
          test -n "$AFTER_SIXTY_DRIVE_FOLDER_ID" || { echo "::error::Confirm an After Sixty folder first, then set AFTER_SIXTY_DRIVE_FOLDER_ID"; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install read-only Drive API client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Import approved and complete episodes only
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          AFTER_SIXTY_DRIVE_FOLDER_ID: ${{ secrets.AFTER_SIXTY_DRIVE_FOLDER_ID }}
        run: python scripts/after_sixty_drive_sync.py --write

      - name: Generate static social previews and sitemap additions
        run: python scripts/build_after_sixty_share.py

      - name: Validate entire site and section
        run: |
          python -m unittest discover -s tests -p 'test_after_sixty.py' -v
          python scripts/verify_site.py
          python scripts/verify_identity.py
          node --check dist/after-sixty-v1.js
          git diff --check

      - name: Commit to new review branch only
        id: changes
        run: |
          git add -- dist/data/after-sixty.json dist/share/ dist/sitemap.xml
          if git diff --cached --quiet; then
            echo "No new approved content."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content(after-sixty): review approved Drive episodes"
          git push origin HEAD:"$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request for human approval (never auto-merge)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title "After Sixty — approved Drive content review" \
            --body "Drive content passed approval and document consistency checks. Please review each article, YouTube ID, Drive access permission and static preview before merging. No automatic production publication is authorized."
