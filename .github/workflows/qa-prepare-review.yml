name: Prepare QA corrections on isolated review branch
on:
  push:
    branches:
      - fix/qa-security-seo-perf-2026-11-15

permissions:
  contents: write

concurrency:
  group: qa-fix-review-20261115
  cancel-in-progress: false

jobs:
  prepare:
    # This workflow is intentionally scoped to the specified non-production branch.
    if: github.ref == 'refs/heads/fix/qa-security-seo-perf-2026-11-15'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qa-security-seo-perf-2026-11-15
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install safe offline asset conversion dependencies
        run: python -m pip install --disable-pip-version-check Pillow csscompressor
      - name: Verify remediation tools compile
        run: |
          python3 -m py_compile scripts/apply_qa_fixes.py
          python3 -m py_compile scripts/qa_gate.py
      - name: Apply reviewed changes locally (never to main)
        run: python3 scripts/apply_qa_fixes.py
      - name: Preserve original media and commit only to the review branch
        run: |
          git add -- dist/ docs/registry/ docs/qa-source-assets/
          if git diff --cached --quiet; then
            echo "No changes to stage"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: optimize original media, restrict embeds, bundle CSS and harden SEO on review branch"
            git push origin HEAD:fix/qa-security-seo-perf-2026-11-15
          fi
      - name: Verify Python QA exit code after preparation
        run: python3 scripts/qa_gate.py
      - name: Verify existing routing and editorial registry
        run: |
          python3 scripts/verify_site.py
          python3 scripts/build_site_master_registry.py --check
