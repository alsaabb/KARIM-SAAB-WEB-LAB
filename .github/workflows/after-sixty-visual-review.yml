name: After Sixty — browser visual review (no deploy)
on:
  push:
    branches:
      - feature/after-sixty-library-v1-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless Chromium test tools
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify responsive layout and interactions
        run: python scripts/after_sixty_visual_check.py
      - name: Save screenshots and report for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-sixty-desktop-mobile-visual-review
          path: visual-review/after-sixty/
          if-no-files-found: warn
          retention-days: 14
