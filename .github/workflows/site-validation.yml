name: Validate KARIM SAAB site
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  site-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check sitemap and bilingual links
        run: python3 scripts/verify_site.py
