name: Export full KARIM SAAB repository snapshot
on:
  push:
    branches:
      - backup/site-snapshot-20261109
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Create complete source ZIP and audit manifest
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=KARIM_SAAB_GITHUB_MAIN_COMPLETE_SOURCE.zip HEAD
          git rev-parse HEAD > SOURCE_COMMIT_SHA.txt
          git ls-tree -r --name-only HEAD | wc -l > SOURCE_FILE_COUNT.txt
          sha256sum KARIM_SAAB_GITHUB_MAIN_COMPLETE_SOURCE.zip > SHA256SUMS.txt
      - name: Upload archival files for Drive handoff
        uses: actions/upload-artifact@v4
        with:
          name: karim-saab-main-complete-source-20261109
          path: |
            KARIM_SAAB_GITHUB_MAIN_COMPLETE_SOURCE.zip
            SOURCE_COMMIT_SHA.txt
            SOURCE_FILE_COUNT.txt
            SHA256SUMS.txt
          retention-days: 7
