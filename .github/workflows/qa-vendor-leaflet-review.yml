name: One-time Leaflet vendor on QA review branch (no deploy)
on:
  push:
    branches:
      - fix/qa-security-seo-perf-2026-11-15
permissions:
  contents: write
concurrency:
  group: qa-leaflet-vendor-20261115
  cancel-in-progress: false
jobs:
  vendor:
    if: github.ref == 'refs/heads/fix/qa-security-seo-perf-2026-11-15'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout review branch only
        uses: actions/checkout@v4
        with:
          ref: fix/qa-security-seo-perf-2026-11-15
          persist-credentials: true
      - name: Download and SHA-256 verify official Leaflet 1.9.4 plus local icons
        run: python3 scripts/vendor_leaflet_review.py
      - name: Reconcile static media registry
        run: python3 scripts/build_site_master_registry.py --write
      - name: Commit vendor artifacts exclusively to review branch
        run: |
          git add -- dist/index.html dist/assets/vendor/leaflet/ docs/registry/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: self-host SHA-256 verified Leaflet v1.9.4 and tighten CSP"
            git push origin HEAD:fix/qa-security-seo-perf-2026-11-15
          else
            echo "Leaflet vendor already up-to-date"
          fi
      - name: Verify site and registry after vendoring
        run: |
          python3 scripts/verify_site.py
          python3 scripts/build_site_master_registry.py --check
