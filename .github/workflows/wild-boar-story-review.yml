name: Wild Boar story — owner-approved browser review and master snapshots (NO DEPLOY)
on:
  push:
    branches: [feature/wild-boar-greece-story-20261113]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-snapshot:
    if: github.ref == 'refs/heads/feature/wild-boar-greece-story-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout review branch (never main)
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate whole-site page and media master
        run: |
          python3 scripts/build_site_master_registry.py --write
          python3 scripts/build_site_master_registry.py --check
      - name: Validate approved story, original excerpts, routes and SEO
        run: |
          python3 -m unittest discover -s tests -p 'test_wild_boar_story.py' -v
          python3 -m unittest discover -s tests -p 'test_site_master_registry.py' -v
          python3 scripts/verify_site.py
          node --check dist/wild-boar-story-v1.js
      - name: Set up Chromium for real DOM layout checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify AR/EN desktop, mobile and click-to-play
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ks-wb-http.log 2>&1 &
          node tests/wild_boar_story_browser.cjs
      - name: Commit reproducible registry to this review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/registry/page_registry.json docs/registry/media_registry.json docs/registry/INVENTORY_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(master): index owner-approved Wild Boar Greece article and video'
            git push origin HEAD:feature/wild-boar-greece-story-20261113
          fi
      - name: Save browser evidence for approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KARIM_WILD_BOAR_GREECE_AR_EN_VISUAL_REVIEW
          path: visual-review/wild-boar/
          if-no-files-found: warn
          retention-days: 30
