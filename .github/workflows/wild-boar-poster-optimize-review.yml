name: One-time Wild Boar approved poster optimization (review branch only)
on:
  push:
    branches: [poster/wild-boar-owner-image-20261113]
    paths:
      - 'dist/assets/stories/wild-boar-greece/poster-original.png'
      - '.github/workflows/wild-boar-poster-optimize-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize-owner-poster:
    if: github.ref == 'refs/heads/poster/wild-boar-owner-image-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processor
        run: python -m pip install Pillow==11.3.0
      - name: Verify exact owner original and create web-friendly poster
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          source=Path('dist/assets/stories/wild-boar-greece/poster-original.png')
          if not source.exists():
              print('Already optimized on this branch; nothing to change.')
              raise SystemExit(0)
          expected='8013a6d7ed2ceb2408ce4e08f03888565f6d03c3eefcae72f3545d56ca70f6b5'
          actual=hashlib.sha256(source.read_bytes()).hexdigest()
          assert actual==expected, ('Unexpected original source SHA256',actual)
          with Image.open(source) as original:
              assert original.size==(941,1672), original.size
              assert abs(original.width/original.height-9/16)<.008
              image=original.convert('RGB')
          out=source.with_name('poster.webp')
          image.save(out,'WEBP',quality=85,method=6)
          check=Image.open(out)
          assert check.size==(941,1672) and check.format=='WEBP'
          assert 100_000<out.stat().st_size<800_000
          print('Owner poster optimized:',out,'size:',out.stat().st_size,'bytes')
          PY
      - name: Commit optimized copy and REMOVE staging PNG on review branch
        run: |
          source=dist/assets/stories/wild-boar-greece/poster-original.png
          output=dist/assets/stories/wild-boar-greece/poster.webp
          if test -f "$source" && test -f "$output"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm "$source"
            git add "$output"
            git commit -m "assets(stories): optimize owner wild-boar poster to webp and remove staging PNG"
            git push origin HEAD:poster/wild-boar-owner-image-20261113
          fi
